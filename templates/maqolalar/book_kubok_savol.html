<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book Kubok — Savol qo‘shish</title>
<style>
body{margin:0;background:#101010;color:#f5f5f5;font-family:Arial;padding:20px}
.container{max-width:600px;margin:30px auto;background:#1c1c1c;padding:25px;border-radius:16px;border:1px solid #b99a50}
h2{color:#d9b45b;text-align:center}
input,textarea,select{width:100%;box-sizing:border-box;padding:13px;margin:8px 0 15px;background:#292929;color:white;border:1px solid #555;border-radius:8px;font-size:16px}
button{width:100%;padding:15px;background:#c49b43;color:#111;border:0;border-radius:8px;font-weight:bold;font-size:16px}
a{color:#d9b45b;text-decoration:none}
.xato{color:#ff7777}
</style>
</head>
<body>
<div class="container">
<h2>Yangi adabiyot savoli</h2>
{% if xato %}<p class="xato">{{ xato }}</p>{% endif %}
<form method="post">
{% csrf_token %}
<label>Savol matni</label>
<textarea name="savol" rows="4" required></textarea>
<label>A varianti</label>
<input name="variant_a" required>
<label>B varianti</label>
<input name="variant_b" required>
<label>C varianti</label>
<input name="variant_c" required>
<label>D varianti</label>
<input name="variant_d" required>
<label>To‘g‘ri javob</label>
<select name="togri_javob" required>
<option value="">Tanlang</option>
<option value="A">A</option>
<option value="B">B</option>
<option value="C">C</option>
<option value="D">D</option>
</select>
<button type="submit">SAVOLNI SAQLASH</button>
</form>
<p><a href="{% url 'book_kubok_boshqaruv' %}">← Boshqaruv paneliga qaytish</a></p>
</div>
</body>
</html>
