<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909">
<title>Sayt egasi | Book Sahifa</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;min-height:100vh;display:grid;place-items:center;
    background:radial-gradient(ellipse at top,#211a0e,#090909 65%);
    color:#eee9df;font-family:Georgia,serif;padding:20px
}
main{
    width:100%;max-width:430px;padding:35px 28px;
    background:#14120f;border:1px solid #493b27
}
.brand{text-align:center;color:#c9a45e;letter-spacing:4px;font-size:13px}
h1{text-align:center;font-weight:normal;color:#e4c98e;margin:30px 0 10px}
p{text-align:center;color:#999187;font-size:14px;line-height:1.7}
label{display:block;color:#c9a45e;margin:22px 0 9px;font-size:13px}
input{
    width:100%;padding:14px;background:#090909;color:#eee;
    border:1px solid #493b27;font:16px Georgia
}
button{
    width:100%;margin-top:25px;padding:15px;
    background:#c9a45e;color:#090909;border:0;
    font-weight:bold;letter-spacing:1px
}
.error{color:#e58b75;text-align:center;font-size:13px;margin-top:18px}
.back{display:block;text-align:center;margin-top:25px;color:#c9a45e;text-decoration:none;font-size:13px}
</style>
</head>
<body>
<main>
    <div class="brand">BOOK SAHIFA</div>
    <h1>Sayt egasi</h1>
    <p>Shaxsiy jurnalingizni boshqarish uchun tizimga kiring.</p>

    <form method="post">
        {% csrf_token %}
        <label for="username">LOGIN</label>
        <input id="username" name="username" type="text" autocomplete="username" required>

        <label for="password">PAROL</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        {% if xato %}
        <div class="error">{{ xato }}</div>
        {% endif %}

        <button type="submit">KIRISH →</button>
    </form>

    <a class="back" href="/">← Bosh sahifaga qaytish</a>
</main>
</body>
</html>
